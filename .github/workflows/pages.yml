name: Publish English Shop
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack playable web release
        run: |
          cat site.zip.part-* > /tmp/site.zip
          echo "2f2f4b6c6ee2a973f2ee4fb6f19b4210a33a34e0321f1460d6f699897c2ba8c0  /tmp/site.zip" | sha256sum -c -
          mkdir public
          unzip -q /tmp/site.zip -d public
          unzip -oq mobile-audio-fix.zip -d public
          unzip -oq shop-layout-fix.zip -d public
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
